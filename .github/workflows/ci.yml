name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["20.x", "22.x"]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - run: npm ci
            - name: Audit dependencies
              run: npm audit --audit-level=high
