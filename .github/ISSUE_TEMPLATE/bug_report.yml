name: Bug report
description: Something is not working as documented
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security vulnerabilities here** —
        see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message and HTTP status code if you have one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy to ...
        2. Submit the form with ...
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Hosting platform
      options:
        - Cloudflare Pages
        - Netlify
        - Vercel
        - Local development
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "20.11.0"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Function logs from your host. **Redact private keys, tokens and email addresses.**
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I have removed all secrets and personal data from this report.
          required: true
        - label: I have read the setup guide in `docs/SETUP.md`.
          required: true
