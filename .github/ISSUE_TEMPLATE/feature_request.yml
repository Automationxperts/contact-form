name: Feature request
description: Suggest an improvement
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case rather than the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: This project intentionally has no build step and no runtime framework.
      options:
        - label: My proposal does not require a bundler, transpiler or frontend framework.
        - label: I am willing to open a pull request for this.
