# Cloudflare Pages configuration.
# Secrets are set in the dashboard (Settings > Environment variables) or via
# `npx wrangler pages secret put GH_PRIVATE_KEY`. Never commit them here.

name = "gitconnect-contact-form"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# Required by @octokit/auth-app (node:crypto, node:buffer).
compatibility_flags = ["nodejs_compat"]
